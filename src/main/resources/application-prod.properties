# Neon (PostgreSQL).
#   NEON_DB_URL      
#   NEON_DB_USER
#   NEON_DB_PASSWORD
spring.datasource.url=${NEON_DB_URL}
spring.datasource.username=${NEON_DB_USER}
spring.datasource.password=${NEON_DB_PASSWORD}

# A Neon "dorme" quando ociosa: a primeira conexão pode demorar
spring.datasource.hikari.connection-timeout=30000

# Cria/ajusta as tabelas automaticamente.
# Uma opção de upgrade futuro é o Flyway, troque por "validate".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
